<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIS Portal Dashboard</title>

  <!-- Browser Extension Safety Shield & Third-Party Crash Guard -->
  <script>
    window.BHK = window.BHK || { install: function () { }, init: function () { }, widget: {} };
    window.buyhatke = window.buyhatke || {};
    window.addEventListener('error', function (e) {
      if (e.filename && (e.filename.includes('content.ts') || e.filename.includes('affiliate') || e.filename.includes('extension') || e.filename.includes('BHK'))) {
        e.stopImmediatePropagation();
        return true;
      }
    }, true);
  </script>

  <!-- Google Fonts (Plus Jakarta Sans - High-End Agency Typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- External Libraries (Must load BEFORE ArcGIS JS API to prevent Dojo AMD multipleDefine collisions) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>



  <!-- ArcGIS API -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.29/"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/map.css">

</head>

<body class="app-body">
  <!-- Header matching Reference UI with Top Header Navigation -->
  <header class="app-header">
    <div class="header-left">
      <div class="emblem-circle">
        <i class="ph ph-shield-check"></i>
      </div>
      <h1 class="header-portal-title">POC Portal</h1>
    </div>

    <!-- Center Navigation Links in Header -->
    <nav class="header-nav-center">
      <a href="#/dashboard" class="header-nav-item active" data-route="dashboard">
        <i class="ph ph-squares-four"></i> <span>Dashboard</span>
      </a>
      <a href="#/map" class="header-nav-item" data-route="map">
        <i class="ph ph-map-trifold"></i> <span>Map View</span>
      </a>
      <a href="#/tax-records" class="header-nav-item" data-route="tax-records">
        <i class="ph ph-receipt"></i> <span>Tax Records</span>
      </a>
      <a href="#/reports" class="header-nav-item" data-route="reports">
        <i class="ph ph-chart-pie"></i> <span>Reports</span>
      </a>
    </nav>

    <div class="header-right">
      <!-- Collapse Dropdown Menu in Header for Quick Switching -->
      <div class="header-dropdown-wrap">
        <button id="btn-header-modules" class="btn-header-collapse" title="Collapse Navigation Menu">
          <i class="ph ph-squares-four"></i>
          <span>Modules</span>
          <i class="ph ph-caret-down"></i>
        </button>

        <div id="header-modules-menu" class="header-dropdown-menu hidden">
          <a href="#/dashboard" class="header-dropdown-item active" data-route="dashboard">
            <i class="ph ph-squares-four"></i> Dashboard
          </a>
          <a href="#/map" class="header-dropdown-item" data-route="map">
            <i class="ph ph-map-trifold"></i> Map View
          </a>
          <a href="#/tax-records" class="header-dropdown-item" data-route="tax-records">
            <i class="ph ph-receipt"></i> Tax Records
          </a>
          <a href="#/reports" class="header-dropdown-item" data-route="reports">
            <i class="ph ph-chart-pie"></i> Reports
          </a>
        </div>
      </div>

      <button id="btn-logout" class="btn btn-logout-pill">
        <i class="ph ph-sign-out"></i> Log out
      </button>
    </div>
  </header>

  <div class="app-container">


    <!-- Main Content Area -->
    <main id="app-content" class="content-area">
      <!-- Swappable Sections -->
      <section id="sec-dashboard" class="page-section active-section">
        <div id="dashboard-mount"></div>
      </section>

      <section id="sec-map" class="page-section">
        <!-- Map View mounts here -->
        <div id="map-mount" class="full-bleed-map"></div>
      </section>

      <section id="sec-tax-records" class="page-section">
        <div class="section-header">
          <h2>Tax Records</h2>
          <p class="text-muted">Detailed property records (Phase 1 Read-only).</p>
        </div>
        <div id="tax-records-mount"></div>
      </section>

      <section id="sec-reports" class="page-section">
        <div class="section-header">
          <h2>Reports</h2>
          <p class="text-muted">Export tax data and utility reports.</p>
        </div>
        <div id="reports-mount"></div>
      </section>
    </main>
  </div>

  <!-- Scripts -->


  <script src="js/mockData.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/router.js"></script>
  <script src="js/map.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/taxRecords.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/export/exportPdf.js"></script>
  <script src="js/export/exportExcel.js"></script>
  <script src="js/export/exportCsv.js"></script>
  <script>
    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      initRouter();
      initSidebar();
    });
  </script>
</body>

</html>
